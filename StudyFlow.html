<style>

ialog-actions{display:flex;justify-content:space-between;gap:8px;margin-top:22px}.hidden{display:none!important}.toast{position:fixed;right:20px;bottom:20px;background:#684435;color:#fff;padding:12px 18px;border-radius:10px;display:none;z-index:8}.sidebar.collapsed{width:76px}.sidebar.collapsed .brand{font-size:16px;padding:0 0 24px;text-align:center}.sidebar.collapsed .nav{font-size:0;text-align:center;padding:13px 0}.sidebar.collapsed .nav::first-letter{font-size:20px}.sidebar.collapsed .bottom{font-size:0}body.dark{color-scheme:dark;--bg:#101827;--panel:#1a2536;--text:#edf3fc;--muted:#9baac0;--line:#334155;--blue:#2877f0;--soft:#213c63;--shadow:none}.menu{display:none}@media(max-width:1050px){.grid{grid-template-columns:repeat(3,1fr)}.panels{grid-template-columns:1fr}}@media(max-width:700px){.sidebar{position:fixed;z-index:4;left:-245px;top:0;bottom:0;box-shadow:var(--shadow)}.sidebar.mobile-open{left:0}.sidebar.collapsed{width:235px}.sidebar.collapsed .nav{font-size:inherit;text-align:left;padding:13px 15px}.sidebar.collapsed .brand{font-size:23px;text-align:left}.menu{display:inline-block}.top{padding:0 16px}.content{padding:18px}.grid{grid-template-columns:repeat(2,1fr)}.heading h1{font-size:25px}.form-grid{grid-template-columns:1fr}.field.wide{grid-column:auto}.item{align-items:flex-start;flex-wrap:wrap}.actions{width:100%}.top .subtitle{display:none}}

.view-switch{display:flex;gap:8px;margin:12px 0}.kanban{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:14px;align-items:start}.board-col{min-height:220px}.board-card{width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:14px;margin:8px 0;display:flex;flex-direction:column;gap:8px}.cal-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.cal-week{text-align:center;font-weight:700;padding:10px}.cal-day{background:var(--panel);border:1px solid var(--line);color:var(--text);min-height:88px;padding:7px;text-align:left;border-radius:8px;display:flex;flex-direction:column;gap:4px;overflow:hidden}.cal-event{background:var(--soft);color:var(--blue);border-radius:5px;padding:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.cal-today{border-color:var(--blue)}.cal-selected{outline:2px solid var(--blue)}.day-tasks{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;align-items:center}.day-tasks h3{width:100%}.sub-row{display:flex;align-items:center;gap:10px;margin:8px 0}.sub-row span{flex:1}@media(max-width:760px){.kanban{display:flex;overflow-x:auto}.board-col{min-width:230px}.cal-day{min-height:60px;padding:4px}.cal-event{font-size:9px}.cal-head h2{font-size:17px}}

.backup-card{margin-top:18px}.backup-preview{padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-top:12px}.backup-preview p{margin:6px 0}.backup-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.donut-wrap{display:flex;align-items:center;gap:20px;margin-bottom:16px;flex-wrap:wrap}.donut{width:116px;height:116px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}.donut-center{width:80px;height:80px;background:var(--panel);border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:22px}.legend{display:grid;gap:8px;font-size:13px}.legend-line{display:flex;align-items:center;gap:7px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}.bar-row{display:grid;grid-template-columns:65px 1fr 30px;align-items:center;gap:10px;font-size:13px;margin:10px 0}.bar-track{height:10px;border-radius:12px;background:var(--line);overflow:hidden}.bar-value{height:100%;border-radius:12px}.trend-svg{width:100%;height:175px;display:block;overflow:visible}.trend-axis{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.mini-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.mini-day{border:1px solid transparent;border-radius:7px;background:transparent;color:var(--text);padding:7px 2px;text-align:center;font-size:12px;min-width:0}.mini-day:disabled{cursor:default}.mini-day.has-tasks{background:var(--soft);color:var(--blue);font-weight:750}.mini-day.is-today{border-color:var(--blue)}.mini-week{text-align:center;font-size:11px;color:var(--muted);padding:5px 0}.mini-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.metric{min-width:0}.metric strong{overflow-wrap:anywhere}.top>div{display:flex;align-items:center;gap:6px}.top button{white-space:nowrap}.card{min-width:0}.item .actions button{white-space:nowrap}@media(max-width:900px){.content{padding:20px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.sidebar:not(.collapsed){width:200px}.top{padding:0 18px}}@media(max-width:700px){.sidebar:not(.mobile-open){left:-245px}.sidebar.mobile-open{left:0}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.panels{grid-template-columns:1fr}.top{height:66px}.top .btn{padding:9px 10px}.top #collapse{display:none}.content{padding:14px}.card{padding:16px}.heading{margin-bottom:15px}.heading h1{font-size:24px}.cal-grid{gap:2px}.cal-day{min-height:65px}.toolbar select{flex:1;min-width:120px}}@media(max-width:370px){.grid{grid-template-columns:1fr 1fr;gap:8px}.metric strong{font-size:25px}.metric{padding:12px}.top #theme{font-size:12px}.top #addTop{font-size:12px}}

/* StudyFlow V1.1-A: research workspace */
.research-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}.research-head h2{margin:0 0 7px;font-size:23px}.research-head p{margin:0}.research-stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.project-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.project-card{display:flex;flex-direction:column;gap:12px}.project-card h3{margin:0;font-size:18px;overflow-wrap:anywhere}.project-card p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.project-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.project-card .actions{margin-top:auto}.project-progress-head{display:flex;justify-content:space-between;font-size:13px}.project-empty{grid-column:1/-1}.project-keyword{background:var(--soft);color:var(--blue);border-radius:999px;padding:4px 9px;font-size:12px}.project-dates{display:flex;flex-wrap:wrap;gap:14px}.project-dates span{font-size:12px;color:var(--muted)}@media(max-width:1050px){.research-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.project-grid{grid-template-columns:1fr}.research-head{align-items:stretch}.research-head>button{width:100%}}

<body><div class="layout"><aside class="sidebar" id="sidebar"><div class="brand" id="brand">◆ StudyFlow</div><button class="nav active" data-page="dashboard">▦ 儀表板</button><button class="nav" data-page="tasks">☑ 任務管理</button><button class="nav" data-page="calendar">▤ 行事曆</button><button class="nav" data-page="settings">⚙ 分類管理與備份</button><button class="nav" data-page="research">◇ 研究管理</button><div class="bottom">StudyFlow V1.1 · 本機資料儲存</div></aside><main class="main"><header class="top"><div><button class="btn menu" id="mobileMenu" aria-label="開啟選單">☰</button><button class="btn" id="collapse" aria-label="收合側邊欄">☰</button> <span class="subtitle">讓每一天更有方向</span></div><div><select id="theme" class="theme-select" aria-label="選擇介面配色"><option value="light">☀ 白色</option><option value="dark">☾ 深色</option><option value="warm">◈ 暖色</option></select> <button class="btn primary" id="addTop">＋ 新增任務</button></div></header><div class="content"><div class="heading"><div><h1 id="pageTitle">儀表板</h1><p id="pageDesc">掌握你的學習進度與近期任務</p></div></div><section id="dashboard"><div class="grid" id="metrics"></div><div class="panels"><div class="card"><h2>任務完成情況</h2><div id="summaryChart"></div><div id="summary"></div></div><div class="card"><h2>今日待辦</h2><div id="today"></div></div><div class="card"><h2>近期截止任務（未來 7 天）</h2><div id="upcoming"></div></div><div class="card"><h2>各主要分類任務數</h2><div id="categoryChart"></div><div id="categories"></div></div><div class="card"><h2>最近 7 天任務建立趨勢</h2><div id="trendChart"></div></div><div class="card"><h2>本月迷你月曆</h2><div id="miniCalendar"></div></div></div></section><section id="tasks" class="hidden"><div class="toolbar"><input id="search" placeholder="搜尋任務名稱或描述" aria-label="搜尋任務"><select id="statusFilter" aria-label="依狀態篩選"><option value="all">全部狀態</option><option value="todo">待開始</option><option value="doing">進行中</option><option value="done">已完成</option></select><select id="priorityFilter" aria-label="依優先順序篩選"><option value="all">全部優先級</option><option value="high">高</option><option value="medium">中</option><option value="low">低</option></select><select id="sort" aria-label="排序"><option value="due">依截止日期</option><option value="new">依建立時間（最新）</option><option value="priority">依優先級</option></select></div><div class="view-switch"><button class="btn" id="listView">☷ 清單</button><button class="btn" id="boardView">▥ 看板</button></div><div id="taskList" class="list"></div><div id="kanban" class="kanban hidden"></div></section><section id="calendar" class="hidden"><div class="card"><div class="cal-head"><button class="btn" id="prevMonth">‹ 上個月</button><h2 id="monthLabel"></h2><button class="btn" id="nextMonth">下個月 ›</button><button class="btn" id="thisMonth">今天</button></div><div class="cal-grid" id="calendarGrid"></div><div id="dayTasks" class="day-tasks"></div></div></section><section id="research" class="hidden"><div class="research-head"><div><h2>研究專案 <span class="pill">Research Workspace</span></h2><p class="muted">建立研究方向、設定目標與追蹤進度。文獻與筆記功能將在下一階段加入。</p></div><button class="btn primary" id="addProject" type="button">＋ 新增研究專案</button></div><div class="grid research-stats" id="projectMetrics"></div><div class="toolbar"><input id="projectSearch" placeholder="搜尋專案名稱、描述或關鍵字" aria-label="搜尋研究專案"><select id="projectStatusFilter" aria-label="研究專案狀態"><option value="all">全部狀態</option><option value="idea">構想中</option><option value="reading">文獻探索</option><option value="design">研究設計</option><option value="active">進行中</option><option value="done">已完成</option></select></div><div id="projectList" class="project-grid"></div></section><section id="settings" class="hidden"><div class="card"><h2>自訂項目管理</h2><p class="muted">選擇主要分類，建立課程、研究專案或個人目標等自訂項目。</p><div class="toolbar"><select id="catParent"><option value="academic">課業</option><option value="research">研究</option><option value="personal">個人</option><option value="other">其他</option></select><input id="catName" maxlength="60" placeholder="自訂項目名稱"><button class="btn primary" id="addCategory">新增項目</button></div><div id="categoryList"></div></div><div class="card backup-card"><h2>資料備份與還原</h2><p class="muted">資料儲存在目前瀏覽器。建議定期匯出 JSON 備份；匯入會取代目前全部任務及自訂分類。</p><div class="toolbar"><button class="btn primary" id="exportBackup" type="button">↓ 匯出 JSON 備份</button><button class="btn" id="importBackup" type="button">↑ 匯入 JSON 備份</button><input id="backupFile" type="file" accept=".json,application/json" class="hidden" aria-label="選擇 JSON 備份檔案"></div><div id="backupPreview" class="hidden" role="status"></div></div></section></div></main></div>
<div class="backdrop" id="backdrop"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><h2 id="dialogTitle">新增任務</h2><form id="taskForm"><div class="form-grid"><label class="field wide">任務名稱 *<input id="title" maxlength="120" required></label><label class="field wide">任務描述<textarea id="description" maxlength="3000"></textarea></label><label class="field">主要分類<select id="category"><option value="academic">課業</option><option value="research">研究</option><option value="personal">個人</option><option value="other">其他</option></select></label><label class="field">自訂項目<select id="subcategory"><option value="">不指定</option></select></label><label class="field">截止日期<input id="dueDate" type="date"></label><label class="field">優先順序<select id="priority"><option value="medium">中</option><option value="high">高</option><option value="low">低</option></select></label><label class="field">任務狀態<select id="status"><option value="todo">待開始</option><option value="doing">進行中</option><option value="done">已完成</option></select></label><label class="field">進度模式<select id="progressMode"><option value="manual">手動進度</option><option value="subtasks">子任務自動計算</option></select></label><label class="field wide" id="progressField">手動完成進度（0～100%）<input id="progress" type="number" min="0" max="100" value="0"></label></div><div id="subtaskArea" class="hidden"><h3>子任務</h3><div id="subtaskList"></div><div class="toolbar"><input id="subtaskInput" maxlength="120" placeholder="新增子任務"><button type="button" class="btn" id="addSubtask">＋ 新增</button></div></div><div class="dialog-actions"><button class="btn danger hidden" type="button" id="deleteTask">刪除任務</button><div style="margin-left:auto;display:flex;gap:8px"><button class="btn" type="button" id="cancel">取消</button><button class="btn primary" type="submit">儲存任務</button></div></div></form></div></div><div class="backdrop" id="projectBackdrop"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="projectDialogTitle"><h2 id="projectDialogTitle">新增研究專案</h2><form id="projectForm"><div class="form-grid"><label class="field wide">研究專案名稱 *<input id="projectName" required maxlength="120" placeholder="例如：短影音人氣預測"></label><label class="field wide">研究描述／目標<textarea id="projectDescription" maxlength="4000" placeholder="想探討的研究問題、背景與預期成果"></textarea></label><label class="field wide">研究關鍵字（以逗號分隔）<input id="projectKeywords" maxlength="400" placeholder="例如：LLM, 多模態, 社群媒體"></label><label class="field">研究狀態<select id="projectStatus"><option value="idea">構想中</option><option value="reading">文獻探索</option><option value="design">研究設計</option><option value="active">進行中</option><option value="done">已完成</option></select></label><label class="field">專案進度（0～100%）<input id="projectProgress" type="number" min="0" max="100" value="0" required></label><label class="field">開始日期<input id="projectStart" type="date"></label><label class="field">目標日期<input id="projectDue" type="date"></label></div><div class="dialog-actions"><button class="btn danger hidden" type="button" id="deleteProject">刪除專案</button><div style="margin-left:auto;display:flex;gap:8px"><button class="btn" type="button" id="cancelProject">取消</button><button class="btn primary" type="submit">儲存專案</button></div></div></form></div></div><div id="toast" class="toast" role="status"></div>
<script>
'use strict';
const KEY='studyflow.v1.tasks', PREF='studyflow.v1.preferences', CATKEY='studyflow.v1.categories', PROJECTKEY='studyflow.v1.research.projects';
const labels={todo:'待開始',doing:'進行中',done:'已完成',high:'高',medium:'中',low:'低',academic:'課業',research:'研究',personal:'個人',other:'其他'};
const $=id=>document.getElementById(id);
const safeText=(s)=>String(s??'');
let projects=[],editingProject=null,tasks=[],editing=null,page='dashboard',prefs={theme:'system',collapsed:false},categories=[],draftSubs=[],view='list',calendarDate=new Date(),selectedDate=null;
function read(key,fallback){try{const raw=localStorage.getItem(key);return raw===null?fallback:JSON.parse(raw)}catch{return fallback}}
function validTask(t){return t&&typeof t.id==='string'&&typeof t.title==='string'&&typeof t.createdAt==='string'}
function init(){const data=read(KEY,[]);tasks=Array.isArray(data)?data.filter(validTask):[];categories=read(CATKEY,[]);if(!Array.isArray(categories))categories=[];tasks=tasks.map(t=>({...t,subtasks:Array.isArray(t.subtasks)?t.subtasks:[],progressMode:t.progressMode||'manual',subcategoryId:t.subcategoryId||''}));const savedPrefs=read(PREF,{});prefs={...prefs,...(savedPrefs&&typeof savedPrefs==='object'&&!Array.isArray(savedPrefs)?savedPrefs:{})};projects=read(PROJECTKEY,[]);if(!Array.isArray(projects))projects=[];projects=projects.filter(validProject);applyTheme();$('sidebar').classList.toggle('collapsed',!!prefs.collapsed);bind();render()}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(tasks));return true}catch(e){notify('儲存失敗：請檢查瀏覽器儲存空間或權限');return false}}
function savePrefs(){try{localStorage.setItem(PREF,JSON.stringify(prefs))}catch{notify('外觀偏好無法保存')}}
function notify(msg){const el=$('toast');el.textContent=msg;el.style.display='block';clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.style.display='none',3000)}
function localDate(d=new Date()){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function daysUntil(s){if(!s)return null;const [y,m,d]=s.split('-').map(Number);if(!y||!m||!d)return null;const now=new Date(),a=Date.UTC(y,m-1,d),b=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());return Math.round((a-b)/86400000)}

function exportBackup(){const payload={app:'StudyFlow',schemaVersion:BACKUP_VERSION,exportedAt:new Date().toISOString(),tasks,categories,projects};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`studyflow-backup-${localDate()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('備份檔案已產生')}
let pendingBackup=null;
async function handleBackupFile(e){const file=e.target.files?.[0];e.target.value='';if(!file)return;pendingBackup=null;const preview=$('backupPreview');preview.classList.remove('hidden');preview.replaceChildren();try{if(file.size>12*1024*1024)throw Error('檔案過大（上限 12 MB）');const raw=JSON.parse(await file.text());pendingBackup=validateBackup(raw);preview.className='backup-preview';preview.append(node('strong','',`備份預覽：${file.name}`),node('p','',`將匯入 ${pendingBackup.tasks.length} 筆任務、${pendingBackup.categories.length} 個自訂分類。`),node('p','muted',`目前資料：${tasks.length} 筆任務、${categories.length} 個自訂分類。匯入將全部取代，請先匯出目前資料。`));const actions=node('div','backup-actions'),confirmBtn=node('button','btn danger','確認取代目前資料'),cancelBtn=node('button','btn','取消匯入');confirmBtn.onclick=commitBackup;cancelBtn.onclick=()=>{pendingBackup=null;preview.className='hidden';preview.replaceChildren()};actions.append(confirmBtn,cancelBtn);preview.append(actions)}catch(err){preview.className='backup-preview';preview.append(node('strong','danger','無法匯入：'+err.message));notify('備份驗證未通過')}}
function commitBackup(){if(!pendingBackup||!confirm(`確定用備份取代目前 ${tasks.length} 筆任務及全部自訂分類？此操作無法復原。`))return;const oldTasks=tasks,oldCats=categories,oldProjects=projects;try{const keys=[KEY,CATKEY,PROJECTKEY],previous=keys.map(k=>localStorage.getItem(k));try{localStorage.setItem(KEY,JSON.stringify(pendingBackup.tasks));localStorage.setItem(CATKEY,JSON.stringify(pendingBackup.categories));localStorage.setItem(PROJECTKEY,JSON.stringify(pendingBackup.projects))}catch(err){keys.forEach((k,i)=>{try{if(previous[i]===null)localStorage.removeItem(k);else localStorage.setItem(k,previous[i])}catch{}});throw err}tasks=pendingBackup.tasks;categories=pendingBackup.categories;projects=pendingBackup.projects;pendingBackup=null;$('backupPreview').className='hidden';$('backupPreview').replaceChildren();render();notify('資料匯入成功')}catch(err){tasks=oldTasks;categories=oldCats;projects=oldProjects;notify('匯入失敗：瀏覽器儲存空間不足或權限受限')}}
function initPhase3(){$('exportBackup').addEventListener('click',exportBackup);$('importBackup').addEventListener('click',()=>$('backupFile').click());$('backupFile').addEventListener('change',handleBackupFile)}


// Research project management (V1.1-A). Stored separately from existing task data.
const projectStates={idea:'構想中',reading:'文獻探索',design:'研究設計',active:'進行中',done:'已完成'};
function validProject(p){return !!(p&&typeof p.id==='string'&&p.id.length>0&&typeof p.name==='string'&&p.name.trim().length>0&&p.name.length<=120&&Object.hasOwn(projectStates,p.status)&&Number.isFinite(p.progress)&&p.progress>=0&&p.progress<=100&&typeof p.createdAt==='string'&&typeof p.updatedAt==='string'&&(!p.description||typeof p.description==='string'&&p.description.length<=4000)&&(!p.keywords||Array.isArray(p.keywords)&&p.keywords.length<=30&&p.keywords.every(x=>typeof x==='string'&&x.length<=60))&&(!p.startDate||/^\d{4}-\d{2}-\d{2}$/.test(p.startDate))&&(!p.dueDate||/^\d{4}-\d{2}-\d{2}$/.test(p.dueDate)))}
function persistProjects(){try{localStorage.setItem(PROJECTKEY,JSON.stringify(projects));return true}catch{notify('研究專案儲存失敗，請確認瀏覽器儲存空間');return false}}
function renderProjects(){const metrics=$('projectMetrics');if(!metrics)return;const total=projects.length,finished=projects.filter(p=>p.status==='done').length,active=projects.filter(p=>p.status!=='done').length,avg=total?Math.round(projects.reduce((sum,p)=>sum+p.progress,0)/total):0;metrics.replaceChildren(...[['研究專案',total],['進行／規劃中',active],['已完成',finished],['平均進度',avg+'%']].map(([label,value])=>{const c=node('div','card metric');c.append(node('div','label',label),node('strong','',value));return c}));const q=$('projectSearch').value.trim().toLowerCase(),filter=$('projectStatusFilter').value;const found=projects.filter(p=>(filter==='all'||p.status===filter)&&(!q||[p.name,p.description,...(p.keywords||[])].join(' ').toLowerCase().includes(q))).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));const list=$('projectList');list.replaceChildren();if(!found.length){list.append(node('div','card empty project-empty',projects.length?'沒有符合條件的研究專案':'尚未建立研究專案，點擊「新增研究專案」開始'));return}for(const p of found){const card=node('article','card project-card'),heading=node('h3','',p.name),meta=node('div','project-meta');meta.append(node('span','pill',projectStates[p.status]));for(const k of (p.keywords||[]).slice(0,5))meta.append(node('span','project-keyword',k));const desc=node('p','muted',p.description||'尚未填寫研究描述');const ph=node('div','project-progress-head');ph.append(node('span','','研究進度'),node('strong','',p.progress+'%'));const track=node('div','progress'),fill=node('div');fill.style.width=p.progress+'%';track.append(fill);const dates=node('div','project-dates');if(p.startDate)dates.append(node('span','','開始：'+p.startDate));if(p.dueDate)dates.append(node('span','','目標：'+p.dueDate));const actions=node('div','actions'),edit=node('button','btn','編輯專案');edit.type='button';edit.onclick=()=>openProjectEditor(p.id);actions.append(edit);card.append(heading,meta,desc,ph,track,dates,actions);list.append(card)}}
function openProjectEditor(id=null){editingProject=id;const p=projects.find(x=>x.id===id);$('projectForm').reset();$('projectDialogTitle').textContent=p?'編輯研究專案':'新增研究專案';$('projectName').value=p?.name||'';$('projectDescription').value=p?.description||'';$('projectKeywords').value=(p?.keywords||[]).join(', ');$('projectStatus').value=p?.status||'idea';$('projectProgress').value=p?.progress??0;$('projectStart').value=p?.startDate||'';$('projectDue').value=p?.dueDate||'';$('deleteProject').classList.toggle('hidden',!p);$('projectBackdrop').classList.add('show');$('projectName').focus()}
function closeProjectEditor(){$('projectBackdrop').classList.remove('show');editingProject=null}
function submitProject(e){e.preventDefault();const name=$('projectName').value.trim(),progress=Number($('projectProgress').value),startDate=$('projectStart').value,dueDate=$('projectDue').value,keywords=[...new Set($('projectKeywords').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean))];if(!name||!Number.isFinite(progress)||progress<0||progress>100||keywords.length>30||keywords.some(x=>x.length>60)){notify('請確認名稱、進度與關鍵字格式');return}if(startDate&&dueDate&&startDate>dueDate){notify('目標日期不可早於開始日期');return}const status=$('projectStatus').value;const data={name,description:$('projectDescription').value.trim(),keywords,status,progress:status==='done'?100:progress,startDate,dueDate,updatedAt:new Date().toISOString()};const previous=projects.map(p=>({...p})),p=projects.find(x=>x.id===editingProject);if(p)Object.assign(p,data);else projects.push({id:crypto.randomUUID(),...data,createdAt:new Date().toISOString()});if(!persistProjects()){projects=previous;return}closeProjectEditor();renderProjects();notify(p?'研究專案已更新':'研究專案已建立')}
function removeProject(){if(!editingProject||!confirm('確定刪除這個研究專案？此操作無法復原。'))return;const previous=projects;projects=projects.filter(p=>p.id!==editingProject);if(!persistProjects()){projects=previous;return}closeProjectEditor();renderProjects();notify('研究專案已刪除')}
function bindProjects(){$('addProject').addEventListener('click',()=>openProjectEditor());$('projectForm').addEventListener('submit',submitProject);$('cancelProject').addEventListener('click',closeProjectEditor);$('deleteProject').addEventListener('click',removeProject);$('projectSearch').addEventListener('input',renderProjects);$('projectStatusFilter').addEventListener('change',renderProjects);$('projectBackdrop').addEventListener('click',e=>{if(e.target===$('projectBackdrop'))closeProjectEditor()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('projectBackdrop').classList.contains('show'))closeProjectEditor()})}

init();initPhase3();
</script></body></html>
